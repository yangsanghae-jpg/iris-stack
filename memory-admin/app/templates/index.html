<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS Memory Admin</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: #222; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1, h2 { margin: 0 0 12px 0; }
    .card { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input, textarea, button { width: 100%; box-sizing: border-box; border: 1px solid #9ca3af; border-radius: 6px; padding: 8px; font-size: 14px; }
    button { cursor: pointer; background: #111827; color: white; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #d1d5db; padding: 6px; text-align: left; vertical-align: top; }
    th { background: #e5e7eb; }
    .mono { font-family: Menlo, Consolas, monospace; white-space: pre-wrap; overflow: auto; max-height: 280px; background: #111827; color: #f9fafb; padding: 10px; border-radius: 6px; }
    .text-scroll { max-height: 180px; overflow: auto; white-space: pre-wrap; }
    .muted { color: #4b5563; font-size: 12px; }
    .ok { color: #065f46; font-weight: 600; }
    .bad { color: #991b1b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>IRIS Memory Admin</h1>
    <p class="muted">app={{ app_name }} | memory={{ memory_base_url }} | db={{ db_path }}</p>

    <div class="card">
      <h2>Memory Profile Files <span class="muted">(Read only)</span></h2>
      <div class="grid">
        <div>
          <div id="profileFileList"></div>
        </div>
        <div>
          <div class="muted" id="profileFileMeta">파일을 선택하세요.</div>
          <pre class="mono" id="profileFileContent"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    function esc(v) {
      if (v === null || v === undefined) return "";
      return String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    async function loadProfileFiles() {
      const res = await fetch("/api/profile-files");
      const data = await res.json();
      const files = data.files || [];
      const wrap = document.getElementById("profileFileList");
      if (!files.length) {
        wrap.innerHTML = "<div class='muted'>파일 목록을 불러오지 못했습니다.</div>";
        return;
      }
      wrap.innerHTML = files.map(f => `
        <button style="margin-bottom:8px;text-align:left;" data-fn="${esc(f.name)}">
          <div><strong>${esc(f.name)}</strong></div>
          <div class="muted">${esc(f.role || "")} / ${esc(f.size)} bytes</div>
        </button>
      `).join("");

      for (const btn of wrap.querySelectorAll("button[data-fn]")) {
        btn.addEventListener("click", async (e) => {
          const fn = e.currentTarget.getAttribute("data-fn");
          const r = await fetch(`/api/profile-files/${encodeURIComponent(fn)}`);
          const d = await r.json();
          document.getElementById("profileFileMeta").textContent =
            d.ok ? `${d.name} | ${d.role} | Read only` : `읽기 실패: ${d.error || "unknown"}`;
          document.getElementById("profileFileContent").textContent = d.ok ? (d.content || "") : "";
        });
      }
    }

    loadProfileFiles();
  </script>
</body>
</html>
