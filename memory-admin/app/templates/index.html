<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS Memory Admin</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: #222; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1, h2 { margin: 0 0 12px 0; }
    .card { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
    label { display: block; font-size: 12px; margin-bottom: 4px; }
    input, textarea, button { width: 100%; box-sizing: border-box; border: 1px solid #9ca3af; border-radius: 6px; padding: 8px; font-size: 14px; }
    button { cursor: pointer; background: #111827; color: white; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #d1d5db; padding: 6px; text-align: left; vertical-align: top; }
    th { background: #e5e7eb; }
    .mono { font-family: Menlo, Consolas, monospace; white-space: pre-wrap; overflow: auto; max-height: 280px; background: #111827; color: #f9fafb; padding: 10px; border-radius: 6px; }
    .text-scroll { max-height: 180px; overflow: auto; white-space: pre-wrap; }
    .muted { color: #4b5563; font-size: 12px; }
    .ok { color: #065f46; font-weight: 600; }
    .bad { color: #991b1b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>IRIS Memory Admin</h1>
    <p class="muted">app={{ app_name }} | memory={{ memory_base_url }} | db={{ db_path }}</p>

    <div class="card">
      <h2>Status</h2>
      <div id="status"></div>
    </div>

    <div class="card">
      <h2>Prefetch Preview</h2>
      <div class="grid">
        <div>
          <label>user_id</label>
          <input id="userId" value="iris" />
        </div>
        <div>
          <label>project_id</label>
          <input id="projectId" value="iris-stack" />
        </div>
      </div>
      <div style="margin-top:10px;">
        <label>query</label>
        <textarea id="query" rows="3">현재 IRIS 시스템 상태</textarea>
      </div>
      <div style="margin-top:10px;">
        <button id="runPrefetch">Run Prefetch</button>
      </div>
      <div style="margin-top:10px;">
        <div class="mono" id="prefetchPreview"></div>
      </div>
    </div>

    <div class="card">
      <h2>Recent Task Histories</h2>
      <div style="overflow:auto;"><table id="tasksTable"></table></div>
    </div>

    <div class="card">
      <h2>Project Memories</h2>
      <div style="overflow:auto;"><table id="projectTable"></table></div>
    </div>

    <div class="card">
      <h2>Skill Memories</h2>
      <div style="overflow:auto;"><table id="skillTable"></table></div>
    </div>

    <div class="card">
      <h2>User Profiles</h2>
      <div style="overflow:auto;"><table id="profileTable"></table></div>
    </div>
  </div>

  <script>
    function esc(v) {
      if (v === null || v === undefined) return "";
      return String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function renderTable(elId, rows) {
      const el = document.getElementById(elId);
      if (!rows || rows.length === 0) {
        el.innerHTML = "<tr><td>no data</td></tr>";
        return;
      }
      const keys = Object.keys(rows[0]);
      let html = "<tr>" + keys.map(k => `<th>${esc(k)}</th>`).join("") + "</tr>";
      for (const row of rows) {
        html += "<tr>" + keys.map(k => {
          const val = row[k];
          const content = typeof val === "object" ? JSON.stringify(val, null, 2) : String(val ?? "");
          return `<td><div class="text-scroll">${esc(content)}</div></td>`;
        }).join("") + "</tr>";
      }
      el.innerHTML = html;
    }

    async function loadSummary() {
      const res = await fetch("/api/summary");
      const data = await res.json();
      const okText = data.ok ? '<span class="ok">OK</span>' : '<span class="bad">FAIL</span>';
      const statusHtml = `
        <div>Summary: ${okText}</div>
        <div>DB path: ${esc(data.db_path || "")}</div>
        <div>table counts: ${esc(JSON.stringify(data.tables || {}))}</div>
      `;
      document.getElementById("status").innerHTML = statusHtml;
      renderTable("tasksTable", data.recent_tasks || []);
      renderTable("projectTable", data.project_memories || []);
      renderTable("skillTable", data.skill_memories || []);
      renderTable("profileTable", data.user_profiles || []);
    }

    async function runPrefetch() {
      const user_id = document.getElementById("userId").value.trim();
      const project_id = document.getElementById("projectId").value.trim();
      const query = document.getElementById("query").value.trim();
      const res = await fetch("/api/prefetch-preview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id, project_id, query })
      });
      const data = await res.json();
      document.getElementById("prefetchPreview").textContent = JSON.stringify({
        ok: data.ok,
        memory_used: data.memory_used,
        memory_context_preview: data.memory_context_preview,
        raw_keys: Object.keys(data.raw || {})
      }, null, 2);
    }

    document.getElementById("runPrefetch").addEventListener("click", runPrefetch);
    loadSummary();
  </script>
</body>
</html>
